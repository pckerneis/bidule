[package]
name = "bidule-cli"
description = "Bidule 01 command-line toolchain: build, run headless, disassemble"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "bidule"
path = "src/main.rs"

[dependencies]
bidule-bytecode = { path = "../bidule-bytecode", features = ["alloc"] }
bidule-compiler = { path = "../bidule-compiler" }
bidule-vm = { path = "../bidule-vm" }
bidule-runtime = { path = "../bidule-runtime" }

[lib]
path = "src/lib.rs"
