[workspace]
resolver = "2"
members = ["crates/bidule-bytecode", "crates/bidule-compiler", "crates/bidule-vm", "crates/bidule-runtime", "crates/bidule-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pckerneis/bidule"

[profile.release]
opt-level = "s"
